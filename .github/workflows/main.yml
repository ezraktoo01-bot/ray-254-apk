name: Build RAY 254 APK V2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g cordova
      - run: |
          cordova create rayapp com.ray254.app.v2 "RAY 254"
          cd rayapp
          cordova platform add android
          rm -rf www/*
      - run: |
          mkdir -p rayapp/www
          cp RAY*.html rayapp/www/index.html || cp RAY*.txt rayapp/www/index.html || ls -la
          ls -lh rayapp/www/
      - run: |
          cd rayapp
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: RAY-254-V2-FIXED
          path: "**/*.apk"
