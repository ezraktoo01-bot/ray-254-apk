name: Build RAY 254 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g cordova
      - run: |
          cordova create app com.ray254.app "RAY 254"
          cd app
          cordova platform add android
          echo '<html><body style="margin:0"><iframe src="https://ray-254.vercel.app" style="width:100vw;height:100vh;border:0"></iframe></body></html>' > www/index.html
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: RAY-254-APK
          path: "**/*.apk"
